<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="인터랙티브 가상 아이폰">
  <meta property="og:title" content="안시현 아이폰">
  <meta property="og:description" content="망사배를 사랑하는 분께 바침!">
  <meta property="og:type" content="website">
  <title>안시현 아이폰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="인터랙티브 스마트폰">
      <div class="screen">
        <div class="status-bar">
          <span id="status-time">9:41</span>
          <div class="status-right" aria-label="상태 표시줄">
            <svg class="signal-icon" viewBox="0 0 24 18" aria-hidden="true">
              <rect x="1" y="12" width="4" height="5" rx="0.7" fill="currentColor"/>
              <rect x="7" y="9" width="4" height="8" rx="0.7" fill="currentColor"/>
              <rect x="13" y="5" width="4" height="12" rx="0.7" fill="currentColor"/>
              <rect x="19" y="1" width="4" height="16" rx="0.7" fill="currentColor"/>
            </svg>
            <svg class="wifi-icon" viewBox="0 0 24 22" aria-hidden="true">
              <path d="M1 5 Q12 -2 23 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M4 8.5 Q12 2.5 20 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M7.5 12 Q12 8.5 16.5 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="12" cy="16.5" r="1.5" fill="currentColor"/>
            </svg>
            <span class="battery" aria-label="배터리 100%"><span></span></span>
          </div>
        </div>

        <section id="lock-screen" class="lock-screen screen-view">
          <div class="lock-date" id="lock-date">10월 18일 일요일</div>
          <div class="lock-clock" id="lock-clock">9:41</div>
          <div class="unlock-area">
            <button type="button" class="primary-button" id="unlock-button">잠금 해제</button>
            <p>눌러서 휴대폰 열기</p>
          </div>
          <div class="lock-bottom"><span>◉</span><span>⌁</span></div>
        </section>

        <section id="home-screen" class="home-screen screen-view hidden">
          <div class="home-weather-widget" aria-label="서울 날씨 위젯">
            <div class="weather-location">서울 <span>현재 날씨</span></div>
            <div class="weather-main"><strong>18°</strong><span class="weather-cloud">☀️</span></div>
            <div class="weather-condition">맑음</div>
            <div class="weather-range"><span>최고 21°</span><span>최저 12°</span></div>
          </div>
          <div class="app-grid">
            <button class="app-icon" data-open="messages">
              <span class="app-art messages-art"><img src="messages-icon.svg" alt=""></span><span>메시지</span>
            </button>
            <button class="app-icon" data-open="photos">
              <span class="app-art photos-art"><img src="photos-icon.svg" alt=""></span><span>사진</span>
            </button>
            <button class="app-icon" data-open="calls">
              <span class="app-art calls-art"><img src="phone-icon.svg" alt=""></span><span>전화</span>
            </button>
            <button class="app-icon" data-open="notes">
              <span class="app-art notes-art"><img src="notes-icon.svg" alt=""></span><span>메모</span>
            </button>
            <button class="app-icon" data-open="kakao">
              <span class="app-art kakao-art"><img src="kakao-icon.svg" alt=""></span><span>카카오톡</span><i id="unread-dot" class="unread-dot hidden"></i>
            </button>
            <button class="app-icon" data-open="instagram">
              <span class="app-art instagram-art"><img src="instagram-icon.svg" alt=""></span><span>Instagram</span>
            </button>
            <button class="app-icon" data-open="bubble">
              <span class="app-art bubble-art"><img src="bubble-icon.svg" alt=""></span><span>버블</span>
            </button>
          </div>
          <div class="dock">
            <button class="dock-icon app-art calls-art" data-open="calls" aria-label="전화"><img src="phone-icon.svg" alt=""></button>
            <button class="dock-icon app-art messages-art" data-open="messages" aria-label="메시지"><img src="messages-icon.svg" alt=""></button>
            <button class="dock-icon app-art photos-art" data-open="photos" aria-label="사진"><img src="photos-icon.svg" alt=""></button>
            <button class="dock-icon app-art notes-art" data-open="notes" aria-label="메모"><img src="notes-icon.svg" alt=""></button>
          </div>
        </section>

        <section id="app-screen" class="app-screen screen-view hidden">
          <header class="app-header">
            <button id="back-button" class="back-button" aria-label="뒤로">‹ <span>홈</span></button>
            <h1 id="app-title">메시지</h1>
            <button id="header-action" class="header-action" aria-label="추가 작업"></button>
          </header>
          <div id="app-content" class="app-content"></div>
        </section>

        <section id="passcode-modal" class="passcode-modal hidden" aria-label="암호 입력" aria-hidden="true">
          <button type="button" id="passcode-close" class="passcode-close" aria-label="닫기">취소</button>
          <div class="passcode-title">암호 입력</div>
          <div id="passcode-dots" class="passcode-dots" aria-label="입력한 암호 자리 수">
            <span></span><span></span><span></span><span></span>
          </div>
          <div id="passcode-error" class="passcode-error" aria-live="polite">암호를 입력하세요.</div>
          <div class="keypad">
            <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
            <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
            <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
            <span></span><button data-digit="0">0</button><button id="passcode-delete" class="keypad-delete">⌫</button>
          </div>
        </section>
      </div>
      <button class="home-indicator" id="home-indicator" aria-label="홈 화면으로 이동"></button>
    </section>
    <p class="stage-caption">인터랙티브 휴대폰 · 데모</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
