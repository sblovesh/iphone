<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="인터랙티브 가상 아이폰">
  <meta property="og:title" content="내 휴대폰">
  <meta property="og:description" content="휴대폰 속 앱을 직접 둘러보세요.">
  <meta property="og:type" content="website">
  <title>내 휴대폰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="인터랙티브 스마트폰">
      <div class="screen">
        <div class="status-bar">
          <span id="status-time">9:41</span>
          <div class="status-right" aria-label="상태 표시줄">
            <svg class="signal-icon" viewBox="0 0 20 14" aria-hidden="true">
              <rect x="1" y="9" width="3" height="4" rx="0.7" fill="currentColor"/>
              <rect x="5.5" y="6.5" width="3" height="6.5" rx="0.7" fill="currentColor"/>
              <rect x="10" y="3.5" width="3" height="9.5" rx="0.7" fill="currentColor"/>
              <rect x="14.5" y="0.5" width="3" height="12.5" rx="0.7" fill="currentColor"/>
            </svg>
            <svg class="wifi-icon" viewBox="0 0 24 22" aria-hidden="true">
              <path d="M1 4.5 Q12 -2.5 23 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M3.5 7.5 Q12 1 20.5 7.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M6 10.5 Q12 6 18 10.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M8.5 13.5 Q12 11 15.5 13.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="12" cy="17" r="1.3" fill="currentColor"/>
            </svg>
            <span class="battery" aria-label="배터리 100%"><span></span></span>
          </div>
        </div>

        <section id="lock-screen" class="lock-screen screen-view">
          <div class="lock-date" id="lock-date">10월 18일 일요일</div>
          <div class="lock-clock" id="lock-clock">9:41</div>
          <div class="unlock-area">
            <button type="button" class="primary-button" id="unlock-button">잠금 해제</button>
            <p>눌러서 휴대폰 열기</p>
          </div>
          <div class="lock-bottom"><span>◉</span><span>⌁</span></div>
        </section>

        <section id="home-screen" class="home-screen screen-view hidden">
          <div class="home-date">
            <div id="home-greeting">일요일</div>
            <div class="home-date-large" id="home-date-large">10월 18일</div>
          </div>
          <div class="app-grid">
            <button class="app-icon" data-open="messages">
              <span class="app-art messages-art">▰</span><span>메시지</span><i id="unread-dot" class="unread-dot hidden"></i>
            </button>
            <button class="app-icon" data-open="photos">
              <span class="app-art photos-art"><span></span></span><span>사진</span>
            </button>
            <button class="app-icon" data-open="calls">
              <span class="app-art calls-art">☎</span><span>전화</span>
            </button>
            <button class="app-icon" data-open="notes">
              <span class="app-art notes-art">≡</span><span>메모</span>
            </button>
          </div>
          <div class="widget">
            <div class="widget-top"><span>오늘의 기록</span><span>⌁</span></div>
            <div class="widget-title">당신의 하루를<br>차곡차곡 기록해 보세요.</div>
            <div class="widget-foot">메모 앱에서 새로운 기록을 남길 수 있어요.</div>
          </div>
          <div class="dock">
            <button class="dock-icon app-art calls-art" data-open="calls" aria-label="전화">☎</button>
            <button class="dock-icon app-art messages-art" data-open="messages" aria-label="메시지">▰</button>
            <button class="dock-icon app-art photos-art" data-open="photos" aria-label="사진"><span></span></button>
            <button class="dock-icon app-art notes-art" data-open="notes" aria-label="메모">≡</button>
          </div>
        </section>

        <section id="app-screen" class="app-screen screen-view hidden">
          <header class="app-header">
            <button id="back-button" class="back-button" aria-label="뒤로">‹ <span>홈</span></button>
            <h1 id="app-title">메시지</h1>
            <button id="header-action" class="header-action" aria-label="추가 작업"></button>
          </header>
          <div id="app-content" class="app-content"></div>
        </section>

        <section id="passcode-modal" class="passcode-modal hidden" aria-label="암호 입력" aria-hidden="true">
          <button type="button" id="passcode-close" class="passcode-close" aria-label="닫기">취소</button>
          <div class="passcode-title">암호 입력</div>
          <div id="passcode-dots" class="passcode-dots" aria-label="입력한 암호 자리 수">
            <span></span><span></span><span></span><span></span>
          </div>
          <div id="passcode-error" class="passcode-error" aria-live="polite">암호를 입력하세요.</div>
          <div class="keypad">
            <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
            <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
            <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
            <span></span><button data-digit="0">0</button><button id="passcode-delete" class="keypad-delete">⌫</button>
          </div>
        </section>
      </div>
      <button class="home-indicator" id="home-indicator" aria-label="홈 화면으로 이동"></button>
    </section>
    <p class="stage-caption">인터랙티브 휴대폰 · 데모</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
